name: Build & test PR (frontend)

on:
  pull_request:
    paths-ignore:
      - 'backend/**'
      - 'frontend/.gitignore'
      - 'frontend/.nais/**'
      - '**.md'
      - 'LICENCE'
      - 'CODEOWNERS'
      - '.github/workflows/*-backend.yaml'
      - '.github/workflows/deploy-frontend.yaml'
      - '.github/workflows/digestabot-automerge.yaml'
      - '.github/workflows/digestabot-update.yaml'
      - 'dependabot-automerge.yaml'
      - '.github/workflows/manual-deploy-frontend.yaml'
      - '.github/workflows/codeql-scan-frontend.yaml'
      - '.github/dependabot.yaml'

env:
  TZ: Europe/Oslo

jobs:
  build-test-pr:
    permissions:
      contents: read
    name: Build & test application
    uses: navikt/mob-gha-workflows/.github/workflows/node-build-pr.yaml@eeb9163c47db1ceaadebd3130fa5f03c0fbf0b45 # ratchet:navikt/mob-gha-workflows/.github/workflows/node-build-pr.yaml@v1.2.1
    secrets: inherit
    with:
      project-directory: frontend
