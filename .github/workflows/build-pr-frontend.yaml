name: Build & test PR (frontend)

on:
  pull_request:
    paths-ignore:
      - 'backend/**'
      - 'frontend/.gitignore'
      - 'frontend/.nais/**'
      - '**.md'
      - 'LICENCE'
      - 'CODEOWNERS'
      - '.github/workflows/*-backend.yaml'
      - '.github/workflows/deploy-frontend.yaml'
      - 'dependabot-automerge.yaml'
      - '.github/workflows/manual-deploy-frontend.yaml'
      - '.github/workflows/codeql-scan-frontend.yaml'
      - '.github/dependabot.yaml'

env:
  TZ: Europe/Oslo

jobs:
  build-test-pr:
    permissions:
      contents: read
    name: Build & test application
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-pr.yaml@f76a78f10742990ced901927ed5113f6a0803961 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-pr.yaml@v1.1.4
    secrets: inherit
    with:
      project-directory: frontend
