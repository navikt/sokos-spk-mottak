name: Deploy application (backend)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/**'
      - 'backend/.gitignore'
      - 'backend/.editorconfig'
      - 'backend/setupLocalEnvironment.sh'
      - 'backend/.scripts/**'
      - '**.md'
      - 'LICENCE'
      - 'CODEOWNERS'
      - '.github/workflows/*-frontend.yaml'
      - '.github/workflows/build-pr-backend.yaml'
      - '.github/workflows/digestabot-automerge.yaml'
      - '.github/workflows/digestabot-update.yaml'
      - '.github/workflows/codeql-scan-backend.yaml'
      - '.github/workflows/manual-deploy-backend.yaml'
      - '.github/dependabot.yaml'

env:
  TZ: Europe/Oslo

jobs:
  build-and-test:
    permissions:
      contents: read
    name: Build and test
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@eeb9163c47db1ceaadebd3130fa5f03c0fbf0b45 # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.2.1
    with:
      project-directory: backend
      upload-artifact: true

  dependency-submission:
    permissions:
      contents: write
    name: Submit dependency graph
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-dependency-submission.yaml@eeb9163c47db1ceaadebd3130fa5f03c0fbf0b45 # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-dependency-submission.yaml@v1.2.1
    with:
      project-directory: backend

  build-push-image-dev:
    permissions:
      contents: read
      id-token: write
    needs: [build-and-test]
    name: Build push dev image
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@eeb9163c47db1ceaadebd3130fa5f03c0fbf0b45 # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@v1.2.1
    secrets: inherit
    with:
      image-suffix: "dev"
      docker-context: "backend"
      dockerfile: "backend/.nais/dev/Dockerfile"
      use-artifact: true

  build-push-image-prod:
    permissions:
      contents: read
      id-token: write
    needs: [build-and-test]
    name: Build push prod image
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@eeb9163c47db1ceaadebd3130fa5f03c0fbf0b45 # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@v1.2.1
    secrets: inherit
    with:
      docker-context: "backend"
      dockerfile: "backend/.nais/prod/Dockerfile"
      use-artifact: true

  deploy-dev-q1:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image-dev]
    name: Deploy to dev-fss-q1
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@eeb9163c47db1ceaadebd3130fa5f03c0fbf0b45 # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.2.1
    with:
      cluster: dev-fss
      resource: backend/.nais/dev/naiserator-q1.yaml
      image: ${{ needs.build-push-image-dev.outputs.image }}

  deploy-prod:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image-prod, deploy-dev-q1]
    name: Deploy to prod-fss
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@eeb9163c47db1ceaadebd3130fa5f03c0fbf0b45 # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.2.1
    with:
      cluster: prod-fss
      resource: backend/.nais/prod/naiserator-prod.yaml
      image: ${{ needs.build-push-image-prod.outputs.image }}
