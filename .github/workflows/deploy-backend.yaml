name: Deploy application (backend)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/**'
      - 'backend/.gitignore'
      - 'backend/.editorconfig'
      - 'backend/setupLocalEnvironment.sh'
      - 'backend/.scripts/**'
      - '**.md'
      - 'LICENCE'
      - 'CODEOWNERS'
      - '.github/workflows/*-frontend.yaml'
      - '.github/workflows/build-pr-backend.yaml'
      - '.github/workflows/digestabot-automerge.yaml'
      - '.github/workflows/digestabot-update.yaml'
      - '.github/workflows/codeql-scan-backend.yaml'
      - '.github/workflows/manual-deploy-backend.yaml'
      - '.github/dependabot.yaml'

env:
  TZ: Europe/Oslo

jobs:
  build-and-test:
    permissions:
      contents: read
    name: Build and test
    uses: ./.github/workflows/gradle-build-test-backend.yaml
    secrets: inherit
    with:
      upload-artifact: true

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Submit dependency graph
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # ratchet:actions/setup-java@v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"
          cache: gradle

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # ratchet:gradle/actions/dependency-submission@v6.4.0
        with:
          build-root-directory: backend
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}

  build-push-image-dev:
    permissions:
      contents: read
      id-token: write
    needs: [build-and-test]
    name: Build push dev image
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-push-image.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-push-image.yaml@v1.1.0
    secrets: inherit
    with:
      image-suffix: "dev"
      docker-context: "backend"
      dockerfile: "backend/.nais/dev/Dockerfile"
      use-artifact: true

  build-push-image-prod:
    permissions:
      contents: read
      id-token: write
    needs: [build-and-test]
    name: Build push prod image
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-push-image.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-push-image.yaml@v1.1.0
    secrets: inherit
    with:
      docker-context: "backend"
      dockerfile: "backend/.nais/prod/Dockerfile"
      use-artifact: true

  deploy-dev-q1:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image-dev]
    name: Deploy to dev-fss-q1
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.0
    with:
      cluster: dev-fss
      resource: backend/.nais/dev/naiserator-q1.yaml
      image: ${{ needs.build-push-image-dev.outputs.image }}

  deploy-prod:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image-prod, deploy-dev-q1]
    name: Deploy to prod-fss
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.0
    with:
      cluster: prod-fss
      resource: backend/.nais/prod/naiserator-prod.yaml
      image: ${{ needs.build-push-image-prod.outputs.image }}
