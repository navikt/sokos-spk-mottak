name: Build & test PR (backend)

on:
  pull_request:
    paths-ignore:
      - 'frontend/**'
      - 'backend/.gitignore'
      - 'backend/.editorconfig'
      - 'backend/setupLocalEnvironment.sh'
      - 'backend/.scripts/**'
      - 'backend/.nais/**'
      - '**.md'
      - 'LICENCE'
      - 'CODEOWNERS'
      - '.github/workflows/*-frontend.yaml'
      - '.github/workflows/codeql-scan-backend.yaml'
      - '.github/workflows/deploy-backend.yaml'
      - '.github/workflows/digestabot-automerge.yaml'
      - '.github/workflows/digestabot-update.yaml'
      - '.github/workflows/manual-deploy-backend.yaml'
      - '.github/dependabot.yaml'

env:
  TZ: Europe/Oslo

jobs:
  build-and-test:
    permissions:
      contents: read
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@ef9d193067cf5fcce3a63ebb53c7cda7ef9c2541 # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.2.0
    with:
      project-directory: backend
