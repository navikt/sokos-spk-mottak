name: Deploy application (frontend)

on:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches:
      - main
    paths-ignore:
      - 'backend/**'
      - 'frontend/.gitignore'
      - '**.md'
      - 'LICENCE'
      - 'CODEOWNERS'
      - '.github/workflows/*-backend.yaml'
      - '.github/workflows/build-pr-frontend.yaml'
      - '.github/workflows/codeql-scan-frontend.yaml'
      - 'dependabot-automerge.yaml'
      - '.github/workflows/manual-deploy-frontend.yaml'
      - '.github/dependabot.yaml'

env:
  TZ: Europe/Oslo

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push-image:
    permissions:
      contents: read
      id-token: write
    name: Build application & build/push image
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-push-image.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-push-image.yaml@v1.1.2
    secrets: inherit
    with:
      project-directory: frontend
      docker-context: frontend
      dockerfile: frontend/Dockerfile
      server-prune-dev-deps: pnpm run prune:production

  deploy-q1:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image]
    name: Deploy to dev-gcp-q1
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.2
    with:
      cluster: dev-gcp
      resource: frontend/.nais/naiserator-q1.yaml
      image: ${{ needs.build-push-image.outputs.image }}

  deploy-prod:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image, deploy-q1]
    name: Deploy to prod-gcp
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.2
    with:
      cluster: prod-gcp
      resource: frontend/.nais/naiserator-prod.yaml
      image: ${{ needs.build-push-image.outputs.image }}
