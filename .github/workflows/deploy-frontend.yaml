name: Deploy application (frontend)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'backend/**'
      - 'frontend/.gitignore'
      - '**.md'
      - 'LICENCE'
      - 'CODEOWNERS'
      - '.github/workflows/*-backend.yaml'
      - '.github/workflows/build-pr-frontend.yaml'
      - '.github/workflows/codeql-scan-frontend.yaml'
      - '.github/workflows/dependabot-automerge-frontend.yaml'
      - '.github/workflows/digestabot-automerge-frontend.yaml'
      - '.github/workflows/digestabot-update-frontend.yaml'
      - '.github/workflows/manual-deploy-frontend.yaml'
      - '.github/dependabot.yaml'

env:
  TZ: Europe/Oslo

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push-image:
    permissions:
      contents: read
      id-token: write
    name: Build application & build/push image
    uses: navikt/mob-gha-workflows/.github/workflows/node-build-push-image.yaml@9f663f4e1ff4f85a52efa067fbf53c5a6bbaede9 # ratchet:navikt/mob-gha-workflows/.github/workflows/node-build-push-image.yaml@v1.1.2
    secrets: inherit
    with:
      project-directory: frontend
      docker-context: frontend
      dockerfile: frontend/Dockerfile

  deploy-q1:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image]
    name: Deploy to dev-gcp-q1
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@9f663f4e1ff4f85a52efa067fbf53c5a6bbaede9 # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.2
    with:
      cluster: dev-gcp
      resource: frontend/.nais/naiserator-q1.yaml
      image: ${{ needs.build-push-image.outputs.image }}

  deploy-dev-qx:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image]
    name: Deploy to dev-gcp-qx
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@9f663f4e1ff4f85a52efa067fbf53c5a6bbaede9 # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.2
    with:
      cluster: dev-gcp
      resource: frontend/.nais/naiserator-qx.yaml
      image: ${{ needs.build-push-image.outputs.image }}

  deploy-prod:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image, deploy-q1, deploy-dev-qx]
    name: Deploy to prod-gcp
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@9f663f4e1ff4f85a52efa067fbf53c5a6bbaede9 # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.2
    with:
      cluster: prod-gcp
      resource: frontend/.nais/naiserator-prod.yaml
      image: ${{ needs.build-push-image.outputs.image }}
