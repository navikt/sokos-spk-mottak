name: Digestabot Auto-merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

env:
  TZ: Europe/Oslo

jobs:
  digestabot-automerge:
    permissions:
      contents: read
      pull-requests: write
    uses: navikt/mob-gha-workflows/.github/workflows/digestabot-automerge.yaml@ef9d193067cf5fcce3a63ebb53c7cda7ef9c2541 # ratchet:navikt/mob-gha-workflows/.github/workflows/digestabot-automerge.yaml@v1.2.0
    name: Digestabot Auto-merge
    secrets:
      APP_ID: ${{ vars.APP_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
