name: Deploy Unleash API token

on:
  push:
    branches:
      - main
    paths:
      - 'backend/.nais/dev/unleash-q1.yaml'
      - 'backend/.nais/prod/unleash-prod.yaml'
      - '.github/workflows/unleash.yaml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-unleash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Unleash API token to dev-fss
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # ratchet:step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Deploy to dev-fss
        uses: nais/deploy/actions/deploy@7b60caaded00332e9aa117a8342daa0876851dfe # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-fss
          RESOURCE: backend/.nais/dev/unleash-q1.yaml

  deploy-prod:
    name: Deploy Unleash API token to prod-fss
    needs: [deploy-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # ratchet:step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Deploy to prod-fss
        uses: nais/deploy/actions/deploy@7b60caaded00332e9aa117a8342daa0876851dfe # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-fss
          RESOURCE: backend/.nais/prod/unleash-prod.yaml
