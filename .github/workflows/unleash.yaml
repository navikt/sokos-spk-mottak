name: Deploy Unleash API token

on:
  push:
    branches:
      - main
    paths:
      - 'backend/.nais/dev/unleash-q1.yaml'
      - 'backend/.nais/prod/unleash-prod.yaml'
      - '.github/workflows/unleash.yaml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-unleash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Unleash API token to dev-fss
    permissions:
      contents: read
      id-token: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/unleash-deploy.yaml@3242be8cc9cf04f8d65648d1280b7141c3ce781d # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/unleash-deploy.yaml@main
    with:
      cluster: dev-fss
      resource: backend/.nais/dev/unleash-q1.yaml

  deploy-prod:
    name: Deploy Unleash API token to prod-fss
    needs: [deploy-dev]
    permissions:
      contents: read
      id-token: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/unleash-deploy.yaml@3242be8cc9cf04f8d65648d1280b7141c3ce781d # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/unleash-deploy.yaml@main
    with:
      cluster: prod-fss
      resource: backend/.nais/prod/unleash-prod.yaml
