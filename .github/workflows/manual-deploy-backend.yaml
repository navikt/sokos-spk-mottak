name: Deploy application manually (backend)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - q1

env:
  TZ: Europe/Oslo

jobs:
  build-and-test:
    permissions:
      contents: read
    name: Build and test
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@ef9d193067cf5fcce3a63ebb53c7cda7ef9c2541 # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.2.0
    with:
      project-directory: backend
      upload-artifact: true

  build-push-image-dev:
    permissions:
      contents: read
      id-token: write
    needs: [build-and-test]
    name: Build push dev image
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@ef9d193067cf5fcce3a63ebb53c7cda7ef9c2541 # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@v1.2.0
    secrets: inherit
    with:
      image-suffix: "dev"
      image-tag: 'snapshot'
      docker-context: "backend"
      dockerfile: "backend/.nais/dev/Dockerfile"
      use-artifact: true

  deploy-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [ build-push-image-dev ]
    name: Deploy to dev-fss-${{ inputs.environment }}
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@ef9d193067cf5fcce3a63ebb53c7cda7ef9c2541 # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.2.0
    with:
      cluster: dev-fss
      resource: backend/.nais/dev/naiserator-${{ inputs.environment }}.yaml
      image: ${{ needs.build-push-image-dev.outputs.image }}