name: CodeQL Scan (backend)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  TZ: Europe/Oslo

jobs:
  codeql-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    name: CodeQL Scan
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # ratchet:actions/setup-java@v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # ratchet:github/codeql-action/init@v4.38.2
        with:
          tools: linked
          languages: kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Build
        working-directory: backend
        run: ./gradlew build -x test --configuration-cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # ratchet:github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:kotlin"
