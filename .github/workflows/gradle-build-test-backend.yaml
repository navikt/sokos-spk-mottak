name: Build and test backend

on:
  workflow_call:
    inputs:
      upload-artifact:
        required: false
        type: boolean
        default: false
    secrets:
      READER_TOKEN:
        required: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # ratchet:actions/setup-java@v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # ratchet:gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic

      - name: Build and test application
        working-directory: backend
        run: ./gradlew build installDist --configuration-cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Upload build artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: gradle-build-${{ github.run_id }}
          path: backend/build/
          retention-days: 1
