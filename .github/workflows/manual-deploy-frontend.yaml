name: Deploy application manually (frontend)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - q1

env:
  TZ: Europe/Oslo

jobs:
  build-push-image:
    permissions:
      contents: read
      id-token: write
    name: Build application & build/push image
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-push-image.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-push-image.yaml@v1.1.0
    secrets: inherit
    with:
      project-directory: frontend
      docker-context: frontend
      dockerfile: frontend/Dockerfile
      image-tag: snapshot

  deploy-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image]
    name: Deploy to dev-gcp-${{ inputs.environment }}
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.0
    with:
      cluster: dev-gcp
      resource: frontend/.nais/naiserator-${{ inputs.environment }}.yaml
      image: ${{ needs.build-push-image.outputs.image }}
